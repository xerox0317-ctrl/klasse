<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новости Класса 🚀</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161b22;
            --accent-color: #00ff88;
            --accent-hover: #00cc6a;
            --text-main: #ffffff;
            --text-muted: #9e9e9e;
            --danger-color: #ff4757;
            --pinned-color: #eccc68;
            --border-color: rgba(0, 255, 136, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: #12161f;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.08);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 70px;
        }

        /* HEADER */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(13, 15, 18, 0.9);
            backdrop-filter: blur(12px);
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 900;
            font-size: 1.2rem;
            letter-spacing: -0.5px;
        }

        .logo-icon {
            color: var(--accent-color);
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .logo-text span {
            color: var(--accent-color);
        }

        .admin-btn {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--border-color);
            color: var(--accent-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .admin-btn.active {
            background: var(--accent-color);
            color: #000;
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.4);
        }

        /* SEARCH & CATEGORIES */
        .controls-area {
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #12161f;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            background: #1a202c;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 16px 10px 38px;
            border-radius: 12px;
            color: white;
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 8px rgba(0, 255, 136, 0.2);
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .categories-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 4px;
        }

        .categories-bar::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            background: #1e2633;
            border: none;
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.2s;
        }

        .cat-btn.active {
            background: var(--accent-color);
            color: #000;
        }

        /* FEED & POSTS */
        .feed {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 12px 16px;
        }

        .post-card {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }

        .post-card.pinned {
            border: 1px solid var(--pinned-color);
            box-shadow: 0 0 10px rgba(236, 204, 104, 0.15);
        }

        .pinned-badge {
            background: var(--pinned-color);
            color: #000;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 0 0 8px 0;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            width: fit-content;
        }

        .post-header {
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .author-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-color);
        }

        .author-name {
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .verified-badge {
            color: var(--accent-color);
            font-size: 0.8rem;
        }

        .post-time {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .post-body {
            padding: 0 14px 12px 14px;
        }

        .post-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .post-text {
            font-size: 0.9rem;
            color: #d1d5db;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        .post-media {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            background: #000;
            margin-top: 8px;
        }

        /* TIKTOK ACTIONS SIDEBAR/FOOTER */
        .post-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(0, 0, 0, 0.2);
        }

        .action-group {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .action-btn:hover, .action-btn.active {
            color: var(--accent-color);
        }

        .action-btn.liked {
            color: #ff4757;
        }

        .action-btn.liked i {
            animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); }
            100% { transform: scale(1); }
        }

        .admin-controls {
            display: flex;
            gap: 6px;
        }

        .admin-control-btn {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: var(--text-muted);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .admin-control-btn.delete:hover {
            background: var(--danger-color);
            color: white;
        }

        .admin-control-btn.pin:hover {
            background: var(--pinned-color);
            color: black;
        }

        /* BOTTOM NAVBAR */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            height: 60px;
            background: rgba(13, 15, 18, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.7rem;
            cursor: pointer;
            border: none;
            background: none;
        }

        .nav-item.active {
            color: var(--accent-color);
        }

        .nav-item i {
            font-size: 1.2rem;
        }

        .add-post-btn {
            background: var(--accent-color);
            color: #000;
            width: 44px;
            height: 30px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.4);
            border: none;
            cursor: pointer;
        }

        /* MODALS */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #181f2a;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            animation: modalUp 0.3s ease-out;
        }

        @keyframes modalUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            padding: 14px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .modal-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .form-input {
            background: #10141d;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 12px;
            border-radius: 10px;
            color: white;
            font-size: 0.9rem;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--accent-color);
        }

        textarea.form-input {
            resize: none;
            height: 90px;
        }

        .submit-btn {
            background: var(--accent-color);
            color: #000;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
        }

        /* COMMENTS MODAL */
        .comments-list {
            max-height: 250px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .comment-item {
            background: #10141d;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .comment-author {
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 2px;
        }

        .tag-pill {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(0, 255, 136, 0.15);
            color: var(--accent-color);
            text-transform: uppercase;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="logo">
            <i class="fa-solid fa-bolt logo-icon"></i>
            <div class="logo-text">НОВОСТИ <span>КЛАССА</span></div>
        </div>
        <button class="admin-btn" id="adminToggleBtn" onclick="openAdminModal()">
            <i class="fa-solid fa-lock"></i> <span id="adminBtnText">Вход</span>
        </button>
    </header>

    <div class="controls-area">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Поиск новостей..." oninput="filterPosts()">
        </div>
        <div class="categories-bar">
            <button class="cat-btn active" onclick="setCategory('all', this)">🔥 Все</button>
            <button class="cat-btn" onclick="setCategory('новости', this)">📰 Новости</button>
            <button class="cat-btn" onclick="setCategory('хохма', this)">😂 Хохма</button>
            <button class="cat-btn" onclick="setCategory('актуальное', this)">⚡ Актуальное</button>
        </div>
    </div>

    <main class="feed" id="postsFeed"></main>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="setCategory('all', document.querySelectorAll('.cat-btn')[0])">
            <i class="fa-solid fa-house"></i>
            <span>Главная</span>
        </button>
        <button class="add-post-btn" onclick="openNewPostModal()">
            <i class="fa-solid fa-plus"></i>
        </button>
        <button class="nav-item" onclick="openAdminModal()">
            <i class="fa-solid fa-user-shield"></i>
            <span>Админка</span>
        </button>
    </nav>
</div>

<!-- МОДАЛЬНОЕ ОКНО: СОЗДАТЬ ПОСТ -->
<div class="modal" id="newPostModal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title">Создать пост</div>
            <button class="close-btn" onclick="closeModal('newPostModal')"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>Ваше имя</label>
                <input type="text" id="postAuthor" class="form-input" placeholder="Например: Влад">
            </div>
            <div class="form-group">
                <label>Категория</label>
                <select id="postCategory" class="form-input">
                    <option value="новости">📰 Новости</option>
                    <option value="хохма">😂 Хохма</option>
                    <option value="актуальное">⚡ Актуальное</option>
                </select>
            </div>
            <div class="form-group">
                <label>Заголовок</label>
                <input type="text" id="postTitle" class="form-input" placeholder="Короткий заголовок...">
            </div>
            <div class="form-group">
                <label>Текст поста</label>
                <textarea id="postContent" class="form-input" placeholder="Расскажите, что произошло..."></textarea>
            </div>
            <div class="form-group">
                <label>Ссылка на картинку (необязательно)</label>
                <input type="text" id="postImage" class="form-input" placeholder="https://...">
            </div>
            <button class="submit-btn" onclick="submitNewPost()">Опубликовать 🚀</button>
        </div>
    </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО: АДМИНКА -->
<div class="modal" id="adminModal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title">Панель Администратора</div>
            <button class="close-btn" onclick="closeModal('adminModal')"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body" id="adminModalBody">
            <div class="form-group">
                <label>Введите секретный пароль</label>
                <input type="password" id="adminPasswordInput" class="form-input" placeholder="Пароль...">
            </div>
            <button class="submit-btn" onclick="verifyAdmin()">Войти как Админ 👑</button>
        </div>
    </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО: КОММЕНТАРИИ -->
<div class="modal" id="commentsModal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title">Комментарии</div>
            <button class="close-btn" onclick="closeModal('commentsModal')"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body">
            <div class="comments-list" id="commentsContainer"></div>
            <div class="form-group" style="margin-top: 10px;">
                <input type="text" id="commentAuthorInput" class="form-input" placeholder="Ваше имя">
                <input type="text" id="commentTextInput" class="form-input" placeholder="Напишите комментарий..." style="margin-top: 6px;">
            </div>
            <button class="submit-btn" onclick="submitComment()">Отправить 💬</button>
        </div>
    </div>
</div>

<script>
    const ADMIN_PASSWORD = "HohotushnikDedulia98";
    let isAdmin = false;
    let activeCategory = 'all';
    let activePostForComments = null;

    const defaultPosts = [
        {
            id: 1,
            author: "Админ Класса",
            isVerified: true,
            isPinned: true,
            category: "новости",
            title: "Завтра отмена 4 урока!",
            content: "Ребята, учитель по физике заболел, поэтому 4 урока не будет! Расписание на завтра изменено, смотрите в электронном дневнике.",
            image: "https://images.unsplash.com/photo-1580582932707-520aed937b7b?auto=format&fit=crop&w=600&q=80",
            likes: 18,
            views: 42,
            comments: [
                { id: 101, author: "Макс", text: "УРАААА! Можно спать подольше!" },
                { id: 102, author: "Лера", text: "А контрольную перенесли?" }
            ],
            time: "10 мин назад"
        },
        {
            id: 2,
            author: "Данил М.",
            isVerified: false,
            isPinned: false,
            category: "хохма",
            title: "Лицо учителя, когда никто не сделал ДЗ:",
            content: "Когда она говорит 'Кто хочет к доске?', и весь класс резко начинает очень внимательно смотреть в чистую тетрадь... 😂",
            image: "https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?auto=format&fit=crop&w=600&q=80",
            likes: 25,
            views: 68,
            comments: [
                { id: 103, author: "Артем", text: "Жиза 100%" }
            ],
            time: "1 час назад"
        }
    ];

    let posts = JSON.parse(localStorage.getItem("class_news_posts")) || defaultPosts;

    function savePosts() {
        localStorage.setItem("class_news_posts", JSON.stringify(posts));
    }

    function renderPosts() {
        const feed = document.getElementById("postsFeed");
        const searchQuery = document.getElementById("searchInput").value.toLowerCase();
        feed.innerHTML = "";

        let filtered = posts.filter(post => {
            const matchesCat = activeCategory === 'all' || post.category === activeCategory;
            const matchesSearch = post.title.toLowerCase().includes(searchQuery) || post.content.toLowerCase().includes(searchQuery);
            return matchesCat && matchesSearch;
        });

        filtered.sort((a, b) => (b.isPinned ? 1 : 0) - (a.isPinned ? 1 : 0));

        if (filtered.length === 0) {
            feed.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 40px 0;">Постов пока нет... Будь первым, кто добавит! 🚀</div>`;
            return;
        }

        filtered.forEach(post => {
            const card = document.createElement("div");
            card.className = `post-card ${post.isPinned ? 'pinned' : ''}`;
            
            card.innerHTML = `
                ${post.isPinned ? '<div class="pinned-badge"><i class="fa-solid fa-thumbtack"></i> Закреплено</div>' : ''}
                <div class="post-header">
                    <div class="author-info">
                        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=${post.author}" class="avatar" alt="avatar">
                        <div>
                            <div class="author-name">
                                ${post.author}
                                ${post.isVerified ? '<i class="fa-solid fa-circle-check verified-badge"></i>' : ''}
                            </div>
                            <div class="post-time">${post.time}</div>
                        </div>
                    </div>
                    <span class="tag-pill">${post.category}</span>
                </div>
                <div class="post-body">
                    <div class="post-title">${post.title}</div>
                    <div class="post-text">${post.content}</div>
                </div>
                ${post.image ? `<img src="${post.image}" class="post-media" alt="post media">` : ''}
                <div class="post-actions">
                    <div class="action-group">
                        <button class="action-btn ${post.userLiked ? 'liked' : ''}" onclick="toggleLike(${post.id})">
                            <i class="fa-${post.userLiked ? 'solid' : 'regular'} fa-heart"></i>
                            <span>${post.likes}</span>
                        </button>
                        <button class="action-btn" onclick="openCommentsModal(${post.id})">
                            <i class="fa-regular fa-comment"></i>
                            <span>${post.comments.length}</span>
                        </button>
                        <div class="action-btn">
                            <i class="fa-regular fa-eye"></i>
                            <span>${post.views}</span>
                        </div>
                    </div>
                    ${isAdmin ? `
                        <div class="admin-controls">
                            <button class="admin-control-btn pin" onclick="togglePin(${post.id})"><i class="fa-solid fa-thumbtack"></i></button>
                            <button class="admin-control-btn delete" onclick="deletePost(${post.id})"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    ` : ''}
                </div>
            `;
            feed.appendChild(card);
        });
    }

    function toggleLike(postId) {
        const post = posts.find(p => p.id === postId);
        if (post) {
            post.userLiked = !post.userLiked;
            post.likes += post.userLiked ? 1 : -1;
            savePosts();
            renderPosts();
        }
    }

    function setCategory(cat, btn) {
        activeCategory = cat;
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderPosts();
    }

    function filterPosts() {
        renderPosts();
    }

    function openNewPostModal() {
        document.getElementById("newPostModal").classList.add("active");
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove("active");
    }

    function submitNewPost() {
        const author = document.getElementById("postAuthor").value.trim() || "Аноним";
        const category = document.getElementById("postCategory").value;
        const title = document.getElementById("postTitle").value.trim();
        const content = document.getElementById("postContent").value.trim();
        const image = document.getElementById("postImage").value.trim();

        if (!title || !content) {
            alert("Пожалуйста, заполните заголовок и текст!");
            return;
        }

        const newPost = {
            id: Date.now(),
            author: author,
            isVerified: isAdmin,
            isPinned: false,
            category: category,
            title: title,
            content: content,
            image: image || null,
            likes: 0,
            views: 1,
            comments: [],
            time: "Только что"
        };

        posts.unshift(newPost);
        savePosts();
        renderPosts();
        closeModal("newPostModal");

        document.getElementById("postTitle").value = "";
        document.getElementById("postContent").value = "";
        document.getElementById("postImage").value = "";
    }

    function openAdminModal() {
        const modalBody = document.getElementById("adminModalBody");
        if (isAdmin) {
            modalBody.innerHTML = `
                <p style="color: var(--accent-color); font-weight: 700;">Вы вошли как Администратор 👑</p>
                <p style="font-size: 0.85rem; color: var(--text-muted);">Теперь вы можете удалять и закреплять посты.</p>
                <button class="submit-btn" style="background: var(--danger-color); color: white;" onclick="logoutAdmin()">Выйти из Админки</button>
            `;
        } else {
            modalBody.innerHTML = `
                <div class="form-group">
                    <label>Введите секретный пароль</label>
                    <input type="password" id="adminPasswordInput" class="form-input" placeholder="Пароль...">
                </div>
                <button class="submit-btn" onclick="verifyAdmin()">Войти как Админ 👑</button>
            `;
        }
        document.getElementById("adminModal").classList.add("active");
    }

    function verifyAdmin() {
        const input = document.getElementById("adminPasswordInput").value;
        if (input === ADMIN_PASSWORD) {
            isAdmin = true;
            document.getElementById("adminBtnText").innerText = "👑 АДМИН";
            document.getElementById("adminToggleBtn").classList.add("active");
            closeModal("adminModal");
            renderPosts();
        } else {
            alert("Неверный пароль!");
        }
    }

    function logoutAdmin() {
        isAdmin = false;
        document.getElementById("adminBtnText").innerText = "Вход";
        document.getElementById("adminToggleBtn").classList.remove("active");
        closeModal("adminModal");
        renderPosts();
    }

    function deletePost(id) {
        if (confirm("Вы уверены, что хотите удалить этот пост?")) {
            posts = posts.filter(p => p.id !== id);
            savePosts();
            renderPosts();
        }
    }

    function togglePin(id) {
        const post = posts.find(p => p.id === id);
        if (post) {
            post.isPinned = !post.isPinned;
            savePosts();
            renderPosts();
        }
    }

    function openCommentsModal(postId) {
        activePostForComments = postId;
        const post = posts.find(p => p.id === postId);
        const container = document.getElementById("commentsContainer");
        container.innerHTML = "";

        if (post.comments.length === 0) {
            container.innerHTML = `<div style="text-align: center; color: var(--text-muted); font-size: 0.85rem;">Комментариев пока нет.</div>`;
        } else {
            post.comments.forEach(c => {
                const item = document.createElement("div");
                item.className = "comment-item";
                item.innerHTML = `
                    <div>
                        <div class="comment-author">${c.author}</div>
                        <div>${c.text}</div>
                    </div>
                    ${isAdmin ? `<button style="background:none; border:none; color:var(--danger-color); cursor:pointer;" onclick="deleteComment(${post.id},${c.id})"><i class="fa-solid fa-trash"></i></button>` : ''}
                `;
                container.appendChild(item);
            });
        }

        document.getElementById("commentsModal").classList.add("active");
    }

    function submitComment() {
        const author = document.getElementById("commentAuthorInput").value.trim() || "Аноним";
        const text = document.getElementById("commentTextInput").value.trim();

        if (!text) return;

        const post = posts.find(p => p.id === activePostForComments);
        if (post) {
            post.comments.push({
                id: Date.now(),
                author: author,
                text: text
            });
            savePosts();
            openCommentsModal(activePostForComments);
            renderPosts();
            document.getElementById("commentTextInput").value = "";
        }
    }

    function deleteComment(postId, commentId) {
        const post = posts.find(p => p.id === postId);
        if (post) {
            post.comments = post.comments.filter(c => c.id !== commentId);
            savePosts();
            openCommentsModal(postId);
            renderPosts();
        }
    }

    renderPosts();
</script>
</body>
</html>
